name: Build APK Fast
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev
          sudo apt-get install -y libltdl-dev zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake
          pip install --upgrade pip
          pip install buildozer cython

      - name: Fix Config & License
        run: |
          # License ko Zabardasti "Haan" (True) karega
          echo "android.accept_sdk_license = True" >> buildozer.spec
          # Testing Version (37-rc1) ko block karke Stable (34.0.0) use karega
          echo "android.build_tools_version = 34.0.0" >> buildozer.spec

      - name: Build APK
        run: yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
